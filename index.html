      // ---------------------------------------------------------------------
      // GLSL: a single full-screen quad that re-projects the equirect texture
      // into any of the desktop viewing modes. Two modes are evaluated and
      // cross-faded (uMix) so switching modes animates smoothly.
      // ---------------------------------------------------------------------
      const VERT = /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          // Fill clip space directly so the quad is camera-independent.
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `;

      const FRAG = /* glsl */ `
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uTex;
        uniform float uAspect;
        uniform float uLon;   // look longitude (radians)
        uniform float uLat;   // look latitude (radians)
        uniform float uZoom;  // >1 zoom in
        uniform int   uModeA;
        uniform int   uModeB;
        uniform float uMix;   // 0 -> A, 1 -> B

        const float PI = 3.14159265359;
        const float TWO_PI = 6.28318530718;

        // Camera basis, filled in main().
        vec3 gFwd, gRight, gUp;

        vec3 sampleDir(vec3 d) {
          d = normalize(d);
          float u = 0.5 + atan(d.x, -d.z) / TWO_PI;
          float v = 0.5 + asin(clamp(d.y, -1.0, 1.0)) / PI;
          return texture2D(uTex, vec2(u, v)).rgb;
        }

        // Rectilinear (pinhole) projection for Dewarp / MEGA.
        vec4 modeRect(vec2 sp, float fovDeg) {
          float f = tan(radians(fovDeg) * 0.5) / uZoom;
          vec3 dir = gFwd + sp.x * f * gRight + sp.y * f * gUp;
          return vec4(sampleDir(dir), 1.0);
        }

        // Equidistant fisheye for ULTRA.
        vec4 modeUltra(vec2 sp) {
          vec2 q = sp / uZoom;
          float r = length(q);
          vec3 tang = r > 0.0001 ? normalize(gRight * q.x + gUp * q.y) : gRight;
          float theta = r * radians(115.0);
          vec3 dir = gFwd * cos(theta) + tang * sin(theta);
          float a = smoothstep(1.08, 0.98, r);
          return vec4(sampleDir(dir), a);
        }

        // Stereographic "little planet": always looks down, lon spins it.
        vec4 modeTiny(vec2 sp) {
          vec2 q = sp * uZoom;
          float r = length(q);
          float phi = 2.0 * atan(r);
          float az = atan(q.y, q.x) + uLon;
          float s = sin(phi);
          vec3 dir = vec3(s * cos(az), -cos(phi), s * sin(az));
          return vec4(sampleDir(dir), 1.0);
        }

        // Crystal ball: orthographic sphere floating on black.
        vec4 modeBall(vec2 sp) {
          float R = 0.92 / uZoom;
          vec2 q = sp / R;
          float r2 = dot(q, q);
          if (r2 > 1.0) return vec4(0.0);
          float z = sqrt(1.0 - r2);
          vec3 dir = q.x * gRight + q.y * gUp - z * gFwd;
          float a = smoothstep(1.0, 0.97, r2);
          return vec4(sampleDir(dir), a);
        }

        // Flat equirectangular strip, letterboxed, lon scrolls horizontally.
        vec4 modeEqui(vec2 sp) {
          vec2 ip = sp / uZoom;
          float u = fract(ip.x * 0.5 + 0.5 - uLon / TWO_PI);
          float v = 0.5 + ip.y;
          if (v < 0.0 || v > 1.0) return vec4(0.0);
          return vec4(texture2D(uTex, vec2(u, v)).rgb, 1.0);
        }

        vec4 shadeMode(int m, vec2 sp) {
          if (m == 0) return modeRect(sp, 75.0);
          if (m == 1) return modeRect(sp, 115.0);
          if (m == 2) return modeUltra(sp);
          if (m == 3) return modeBall(sp);
          if (m == 4) return modeTiny(sp);
          return modeEqui(sp);
        }

        void main() {
          float cl = cos(uLat);
          gFwd = normalize(vec3(sin(uLon) * cl, sin(uLat), -cos(uLon) * cl));
          gRight = normalize(cross(gFwd, vec3(0.0, 1.0, 0.0)));
          gUp = cross(gRight, gFwd);

          vec2 sp = vUv * 2.0 - 1.0;
          sp.x *= uAspect;

          vec4 a = shadeMode(uModeA, sp);
          vec4 b = shadeMode(uModeB, sp);
          vec4 c = mix(a, b, uMix);
          gl_FragColor = vec4(c.rgb * c.a, 1.0);
        }
      `;

      const TRANSITION_SECONDS = 0.7;

      /**
       * A 360 panoramic photo viewer in XR Blocks.
       *
       * XR / AR mode keeps the original behaviour: an inverted sphere the user
       * stands inside, looked around with head movement or controller pinch.
       *
       * Desktop mode adds Insta360-style projections (Dewarp, MEGA, ULTRA,
       * Crystal Ball, Tiny Planet, Equirectangular) rendered through a
       * full-screen reprojection shader, with animated cross-fades between them.
       */
      class PanoramaViewer extends xb.Script {
        init() {
          // --- Shared texture --------------------------------------------
          const urlParams = new URLSearchParams(window.location.search);
          const src = urlParams.get("src") || "presets/panorama.png";
          const textureLoader = new THREE.TextureLoader();
          this.texture = textureLoader.load(src);
          this.configureTexture(this.texture);

          // --- XR sphere (original feature) ------------------------------
          const geometry = new THREE.SphereGeometry(100, 60, 40);
          geometry.scale(-1, 1, 1);
          this.material = new THREE.MeshBasicMaterial({ map: this.texture });
          this.mesh = new THREE.Mesh(geometry, this.material);
          this.mesh.position.set(0, xb.core.user.height, 0);
          this.add(this.mesh);

          // --- Desktop reprojection quad ---------------------------------
          this.uniforms = {
            uTex: { value: this.texture },
            uAspect: { value: window.innerWidth / window.innerHeight },
            uLon: { value: 0 },
            uLat: { value: 0 },
            uZoom: { value: 1 },
            uModeA: { value: 0 },
            uModeB: { value: 0 },
            uMix: { value: 0 },
          };
          const quadMat = new THREE.ShaderMaterial({
            vertexShader: VERT,
            fragmentShader: FRAG,
            uniforms: this.uniforms,
            depthTest: false,
            depthWrite: false,
          });
          this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat);
          this.quad.frustumCulled = false;
          this.quad.renderOrder = -1;
          this.add(this.quad);

          // Offscreen scene reusing the same quad geometry + material so a
          // snapshot re-renders the current projection at full resolution
          // (the on-screen drawing buffer isn't preserved for readback).
          this.snapScene = new THREE.Scene();
          const snapQuad = new THREE.Mesh(this.quad.geometry, quadMat);
          snapQuad.frustumCulled = false;
          this.snapScene.add(snapQuad);
          this.snapCamera = new THREE.Camera();

          // --- Look / zoom / animation state -----------------------------
          this.autoRotating = false;
          this.lon = 0;
          this.lat = 0;
          this.zoom = 1;

          // Mode + transition state.
          this.displayedMode = 0;
          this.targetMode = 0;
          this.modeA = 0;
          this.modeB = 0;
          this.mixT = 0;
          this.transitioning = false;

          this.inXR = false;
          this.clock = new THREE.Clock();

          // XR pinch-drag state.
          this.xrDragging = false;
          this.xrDragController = null;
          this.lastXrDragPos = new THREE.Vector3();

          this.setupInteractions();
          this.setupDragAndDrop();
          this.setupCommands();

          this.broadcastState();
        }

        // Repeat horizontally so the equirect meridian wraps seamlessly, and
        // disable mipmaps so the projection shader's UV derivative jump at the
        // wrap meridian doesn't show up as a blurry vertical seam.
        configureTexture(tex) {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.generateMipmaps = false;
          tex.needsUpdate = true;
        }

        // --- Mode switching with animated cross-fade ---------------------
        setMode(i) {
          i = ((i % MODES.length) + MODES.length) % MODES.length;
          if (i === this.targetMode && !this.transitioning) return;
          this.modeA = this.targetMode;
          this.modeB = i;
          this.targetMode = i;
          this.mixT = 0;
          this.transitioning = true;
          this.broadcastState();
        }

        cycleMode(dir) {
          this.setMode(this.targetMode + dir);
        }

        broadcastState() {
          window.dispatchEvent(
            new CustomEvent("pano-state", {
              detail: { mode: this.targetMode, xr: this.inXR },
            })
          );
        }

        // --- DOM-driven commands from toolbar / keyboard -----------------
        setupCommands() {
          window.addEventListener("pano-command", (e) => {
            if (e.detail.type === "mode") this.setMode(e.detail.index);
            else if (e.detail.type === "snapshot") this.takeSnapshot();
          });

          window.addEventListener("keydown", (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            const k = e.key.toLowerCase();

            if (k === "s") {
              this.takeSnapshot();
              return;
            }

            // Letter mnemonics (D, M, U, C, T, E).
            const byLetter = MODES.findIndex((m) => m.key.toLowerCase() === k);
            if (byLetter >= 0) {
              this.setMode(byLetter);
              return;
            }
            // Digits 1..6.
            if (k >= "1" && k <= String(MODES.length)) {
              this.setMode(parseInt(k, 10) - 1);
              return;
            }
            if (k === "[") this.cycleMode(-1);
            else if (k === "]") this.cycleMode(1);
            else if (k === "f") this.toggleFullscreen();
            else if (k === "escape")
              window.dispatchEvent(
                new CustomEvent("pano-command", { detail: { type: "help-close" } })
              );
          });
        }

        // --- XR controller pinch-drag (unchanged) ------------------------
        onSelectStart(event) {
          this.xrDragging = true;
          this.xrDragController = event.target;
          this.xrDragController.getWorldPosition(this.lastXrDragPos);
        }

        onSelecting(event) {
          if (!this.xrDragging || event.target !== this.xrDragController) return;
          const currentPos = new THREE.Vector3();
          this.xrDragController.getWorldPosition(currentPos);
          const deltaX = currentPos.x - this.lastXrDragPos.x;
          const deltaY = currentPos.y - this.lastXrDragPos.y;
          this.lon += deltaX * 200;
          this.lat += deltaY * 200;
          this.lastXrDragPos.copy(currentPos);
        }

        onSelectEnd(event) {
          if (event.target === this.xrDragController) {
            this.xrDragging = false;
            this.xrDragController = null;
          }
        }

        toggleFullscreen() {
          if (!document.fullscreenElement) {
            document.body.requestFullscreen().catch((err) => {
              console.warn(`Error enabling full-screen mode: ${err.message}`);
            });
          } else {
            document.exitFullscreen();
          }
        }

        // Re-render the current projection into an offscreen target at full
        // device resolution, then save it as a PNG.
        takeSnapshot() {
          const renderer = xb.core && xb.core.renderer;
          if (!renderer) return;

          const dpr = renderer.getPixelRatio ? renderer.getPixelRatio() : 1;
          const w = Math.min(Math.round(window.innerWidth * dpr), 4096);
          const h = Math.min(Math.round(window.innerHeight * dpr), 4096);

          // Match the snapshot aspect to the requested resolution, finish any
          // in-flight transition so the capture is a single clean mode.
          const prevAspect = this.uniforms.uAspect.value;
          const prevMix = this.uniforms.uMix.value;
          const prevModeA = this.uniforms.uModeA.value;
          this.uniforms.uAspect.value = w / h;
          this.uniforms.uModeA.value = this.uniforms.uModeB.value;
          this.uniforms.uMix.value = 0;

          const rt = new THREE.WebGLRenderTarget(w, h);
          const prevTarget = renderer.getRenderTarget();
          renderer.setRenderTarget(rt);
          renderer.clear();
          renderer.render(this.snapScene, this.snapCamera);
          const buf = new Uint8Array(w * h * 4);
          renderer.readRenderTargetPixels(rt, 0, 0, w, h, buf);
          renderer.setRenderTarget(prevTarget);
          rt.dispose();

          // Restore live uniforms.
          this.uniforms.uAspect.value = prevAspect;
          this.uniforms.uMix.value = prevMix;
          this.uniforms.uModeA.value = prevModeA;

          // GL reads bottom-up; flip rows into a 2D canvas.
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          const img = ctx.createImageData(w, h);
          const rowBytes = w * 4;
          for (let y = 0; y < h; y++) {
            const src = (h - 1 - y) * rowBytes;
            img.data.set(buf.subarray(src, src + rowBytes), y * rowBytes);
          }
          ctx.putImageData(img, 0, 0);

          const stamp = new Date()
            .toISOString()
            .slice(0, 19)
            .replace(/[:T]/g, "-");
          const modeName = MODES[this.targetMode].name.replace(/\s+/g, "");
          canvas.toBlob((blob) => {
            if (!blob) return;
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `pano-${modeName}-${stamp}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          }, "image/png");

          this.flashSnapshot();
        }

        flashSnapshot() {
          const flash = document.getElementById("shutter-flash");
          if (!flash) return;
          flash.classList.remove("fire");
          // Force reflow so the animation can restart on rapid captures.
          void flash.offsetWidth;
          flash.classList.add("fire");
        }

        setupInteractions() {
          this.isDragging = false;
          this.onPointerDownMouseX = 0;
          this.onPointerDownMouseY = 0;
          this.onPointerDownLon = 0;
          this.onPointerDownLat = 0;

          document.addEventListener("pointerdown", (e) => {
            if (e.isPrimary === false) return;
            // Ignore drags that start on the 2D UI overlays.
            if (e.target && e.target.closest &&
                e.target.closest("mode-toolbar, shortcuts-overlay")) return;
            this.isDragging = true;
            this.onPointerDownMouseX = e.clientX;
            this.onPointerDownMouseY = e.clientY;
            this.onPointerDownLon = this.lon;
            this.onPointerDownLat = this.lat;
          });

          document.addEventListener("pointermove", (e) => {
            if (e.isPrimary === false || !this.isDragging) return;
            this.lon =
              (this.onPointerDownMouseX - e.clientX) * 0.1 + this.onPointerDownLon;
            this.lat =
              (e.clientY - this.onPointerDownMouseY) * 0.1 + this.onPointerDownLat;
          });

          document.addEventListener("pointerup", () => {
            this.isDragging = false;
          });

          // Zoom: desktop adjusts the shader zoom; XR keeps camera FOV zoom.
          document.addEventListener("wheel", (e) => {
            if (this.inXR) {
              const camera = xb.core.camera;
              camera.fov = THREE.MathUtils.clamp(
                camera.fov + e.deltaY * 0.05,
                10,
                100
              );
              camera.updateProjectionMatrix();
            } else {
              this.zoom = THREE.MathUtils.clamp(
                this.zoom * (1 - e.deltaY * 0.001),
                0.4,
                4.0
              );
            }
          });

          document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
              e.preventDefault();
              this.autoRotating = !this.autoRotating;
            }
          });

          document.addEventListener("dblclick", () => this.toggleFullscreen());

          window.addEventListener("resize", () => {
            this.uniforms.uAspect.value =
              window.innerWidth / window.innerHeight;
          });
        }

        setupDragAndDrop() {
          const overlay = document.getElementById("drop-zone-overlay");

          document.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "copy";
            overlay.style.opacity = "1";
          });

          document.addEventListener("dragenter", (e) => {
            e.preventDefault();
            overlay.style.opacity = "1";
          });

          document.addEventListener("dragleave", (e) => {
            if (!e.relatedTarget || e.relatedTarget.nodeName === "HTML") {
              overlay.style.opacity = "0";
            }
          });

          document.addEventListener("drop", (e) => {
            e.preventDefault();
            overlay.style.opacity = "0";

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
              const file = e.dataTransfer.files[0];
              if (!file.type.startsWith("image/")) return;

              const reader = new FileReader();
              reader.onload = (event) => {
                const imgUrl = event.target.result;
                const textureLoader = new THREE.TextureLoader();
                textureLoader.load(imgUrl, (newTexture) => {
                  this.configureTexture(newTexture);
                  const old = this.texture;
                  this.texture = newTexture;
                  this.material.map = newTexture;
                  this.material.needsUpdate = true;
                  this.uniforms.uTex.value = newTexture;
                  if (old) old.dispose();
                });
              };
              reader.readAsDataURL(file);
            }
          });
        }

        update() {
          const dt = this.clock.getDelta();

          // Detect XR (immersive) vs desktop and swap render path.
          const xrActive = !!(
            xb.core &&
            xb.core.renderer &&
            xb.core.renderer.xr &&
            xb.core.renderer.xr.isPresenting
          );
          if (xrActive !== this.inXR) {
            this.inXR = xrActive;
            this.broadcastState();
          }
          this.mesh.visible = this.inXR;
          this.quad.visible = !this.inXR;

          // Auto-rotation (when the user isn't actively interacting).
          if (!this.isDragging && !this.xrDragging && this.autoRotating) {
            this.lon += dt * 6.0;
          }
          this.lat = Math.max(-85, Math.min(85, this.lat));

          if (this.inXR) {
            // --- Original XR sphere behaviour ----------------------------
            this.mesh.rotation.y = THREE.MathUtils.degToRad(this.lon);
            this.mesh.rotation.x = THREE.MathUtils.degToRad(this.lat);
            xb.core.camera.getWorldPosition(this.mesh.position);
          } else {
            // --- Desktop reprojection ------------------------------------
            if (this.transitioning) {
              this.mixT += dt / TRANSITION_SECONDS;
              if (this.mixT >= 1) {
                this.mixT = 1;
                this.transitioning = false;
                this.modeA = this.modeB;
              }
            }
            this.uniforms.uLon.value = THREE.MathUtils.degToRad(this.lon);
            this.uniforms.uLat.value = THREE.MathUtils.degToRad(this.lat);
            this.uniforms.uZoom.value = this.zoom;
            this.uniforms.uModeA.value = this.modeA;
            this.uniforms.uModeB.value = this.modeB;
            // Smoothstep easing for a nicer morph.
            const t = this.mixT;
            this.uniforms.uMix.value = this.transitioning
              ? t * t * (3 - 2 * t)
              : 0;
          }
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const options = new xb.Options();
        options.setAppTitle("360 Photo Viewer");

        // Note: Simulator addon is explicitly omitted from imports,
        // preventing the default 2D simulator UI from loading as requested.
        xb.add(new PanoramaViewer());
        xb.init(options);
      });
    </script> </body> </html>
